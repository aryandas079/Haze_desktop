<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
}
html, body {
  width: 100%;
  height: 100%;
  background-color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}
.center-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 740px;
  padding: 0 24px;
  margin-bottom: 4vh; /* optical centering */
  animation: fadeIn 0.4s ease-out;
}
.logo-container {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.05));
}
.logo {
  width: 250px;
  height: 250px;
  object-fit: contain;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  user-select: none;
  -webkit-user-drag: none;
}
.logo:hover {
  transform: scale(1.03);
}

/* Center Search Bar matching Omnibox styling */
.search-wrapper {
  margin-top: 36px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.search-bar {
  width: 100%;
  height: 56px;
  background-color: #F7EDDA;
  border: 1.5px solid #E2D7C2;
  border-radius: 28px;
  display: flex;
  align-items: center;
  padding: 0 12px 0 20px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.search-bar:focus-within {
  border-color: #CDA59B;
  box-shadow: 0 6px 20px rgba(205, 165, 155, 0.22);
}
.search-icon {
  width: 20px;
  height: 20px;
  margin-right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6E695F;
  flex-shrink: 0;
}
.search-icon svg {
  width: 18px;
  height: 18px;
  stroke: #6E695F;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.search-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 16px;
  color: #3C3A36;
  font-weight: 400;
  padding: 0;
  min-width: 0;
}
.search-input::placeholder {
  color: #8C867A;
  font-weight: 400;
}

/* Action Buttons inside Search Bar */
.action-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 6px;
  transition: background-color 0.18s ease, transform 0.15s ease;
  flex-shrink: 0;
  outline: none;
}
.action-btn:hover {
  background-color: #EBE0CA;
}
.action-btn:active {
  transform: scale(0.94);
}
.mic-btn svg {
  width: 20px;
  height: 20px;
  fill: #6E695F;
  transition: fill 0.2s ease;
}
.mic-btn.listening {
  background-color: #FFDFDB !important;
  animation: pulse 1.4s infinite;
}
.mic-btn.listening svg {
  fill: #D93025;
}
.submit-btn svg {
  width: 18px;
  height: 18px;
  stroke: #6E695F;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Voice Recognition Feedback Toast */
.voice-status {
  margin-top: 12px;
  font-size: 13px;
  color: #6E695F;
  height: 18px;
  opacity: 0;
  transition: opacity 0.2s ease;
  font-weight: 500;
}
.voice-status.active {
  opacity: 1;
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.4); }
  70% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(217, 48, 37, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 48, 37, 0); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

  <div class="search-wrapper">
    <div class="search-bar">
      <div class="search-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search or enter web address" autocomplete="off" spellcheck="false">
      
      <!-- Voice Recognition Button -->
      <button type="button" id="micBtn" class="action-btn mic-btn" title="Search by voice">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
        </svg>
      </button>

      <!-- Submit Arrow Button -->
      <button type="button" id="submitBtn" class="action-btn submit-btn" title="Search">
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
    <div id="voiceStatus" class="voice-status">Listening... Say something</div>
  </div>
</div>

<script>
const searchInput = document.getElementById('searchInput');
const submitBtn = document.getElementById('submitBtn');
const micBtn = document.getElementById('micBtn');
const voiceStatus = document.getElementById('voiceStatus');

function performSearch(text) {
  const query = (text !== undefined ? text : searchInput.value).trim();
  if (!query) return;

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'search', query: query }));
  } else {
    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
  }
}

submitBtn.addEventListener('click', () => performSearch());

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    performSearch();
  }
});

// Built-in Voice Recognition (Web Speech API)
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = navigator.language || 'en-US';

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    voiceStatus.textContent = 'Listening... Say something';
    voiceStatus.classList.add('active');
  };

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      transcript += event.results[i][0].transcript;
    }
    searchInput.value = transcript;
    if (event.results[0].isFinal) {
      voiceStatus.textContent = 'Recognized: "' + transcript + '"';
      setTimeout(() => {
        performSearch(transcript);
      }, 400);
    }
  };

  recognition.onerror = (event) => {
    console.error('Speech recognition error:', event.error);
    isListening = false;
    micBtn.classList.remove('listening');
    voiceStatus.textContent = event.error === 'not-allowed' ? 'Microphone access denied' : 'Could not hear you. Try again.';
    setTimeout(() => {
      voiceStatus.classList.remove('active');
    }, 2500);
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    setTimeout(() => {
      voiceStatus.classList.remove('active');
    }, 2000);
  };

  micBtn.addEventListener('click', () => {
    if (isListening) {
      recognition.stop();
    } else {
      try {
        recognition.start();
      } catch (err) {
        console.error('Failed to start speech recognition:', err);
      }
    }
  });
} else {
  micBtn.title = 'Voice search not supported in this browser version';
  micBtn.addEventListener('click', () => {
    voiceStatus.textContent = 'Voice search is not available';
    voiceStatus.classList.add('active');
    setTimeout(() => voiceStatus.classList.remove('active'), 2500);
  });
}

// Auto-focus the search bar
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => searchInput.focus(), 150);
});
</script>

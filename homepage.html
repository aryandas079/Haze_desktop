<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
}
html, body {
  width: 100%;
  height: 100%;
  background-color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}
.center-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 680px;
  padding: 0 24px;
  animation: fadeIn 0.4s ease-out;
}
.logo {
  width: 130px;
  height: 130px;
  object-fit: contain;
  filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.05));
  transition: transform 0.3s ease;
  user-select: none;
  -webkit-user-drag: none;
}
.logo:hover {
  transform: scale(1.04);
}
.title {
  margin-top: 14px;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 6px;
  color: #1a1a1e;
  text-indent: 6px;
}

/* Center Search Bar matching Omnibox styling */
.search-wrapper {
  margin-top: 32px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.search-bar {
  width: 100%;
  height: 52px;
  background-color: #F7EDDA;
  border: 1.2px solid #EBE1CE;
  border-radius: 26px;
  display: flex;
  align-items: center;
  padding: 0 10px 0 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.search-bar:focus-within {
  border-color: #CDA59B;
  box-shadow: 0 4px 14px rgba(205, 165, 155, 0.2);
}
.search-icon {
  width: 20px;
  height: 20px;
  margin-right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6E695F;
  flex-shrink: 0;
}
.search-icon svg {
  width: 18px;
  height: 18px;
  stroke: #6E695F;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.search-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 16px;
  color: #3C3A36;
  font-weight: 400;
  padding: 0;
  min-width: 0;
}
.search-input::placeholder {
  color: #8C867A;
  font-weight: 400;
}

/* Action Buttons inside Search Bar */
.action-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 6px;
  transition: background-color 0.18s ease, transform 0.15s ease;
  flex-shrink: 0;
  outline: none;
}
.action-btn:hover {
  background-color: #EBE0CA;
}
.action-btn:active {
  transform: scale(0.94);
}
.mic-btn svg {
  width: 20px;
  height: 20px;
  fill: #6E695F;
  transition: fill 0.2s ease;
}
.mic-btn.listening {
  background-color: #FFDFDB !important;
  animation: pulse 1.4s infinite;
}
.mic-btn.listening svg {
  fill: #D93025;
}
.submit-btn svg {
  width: 18px;
  height: 18px;
  stroke: #6E695F;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Voice Recognition Feedback Toast */
.voice-status {
  margin-top: 12px;
  font-size: 13px;
  color: #6E695F;
  height: 18px;
  opacity: 0;
  transition: opacity 0.2s ease;
  font-weight: 500;
}
.voice-status.active {
  opacity: 1;
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.4); }
  70% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(217, 48, 37, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 48, 37, 0); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<script>
const searchInput = document.getElementById('searchInput');
const submitBtn = document.getElementById('submitBtn');
const micBtn = document.getElementById('micBtn');
const voiceStatus = document.getElementById('voiceStatus');

function performSearch(text) {
  const query = (text !== undefined ? text : searchInput.value).trim();
  if (!query) return;

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'search', query: query }));
  } else {
    // Fallback if opened standalone
    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
  }
}

submitBtn.addEventListener('click', () => performSearch());

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    performSearch();
  }
});

// Built-in Voice Recognition (Web Speech API)
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = navigator.language || 'en-US';

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    voiceStatus.textContent = 'Listening... Say something';
    voiceStatus.classList.add('active');
  };

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      transcript += event.results[i][0].transcript;
    }
    searchInput.value = transcript;
    if (event.results[0].isFinal) {
      voiceStatus.textContent = 'Recognized: "' + transcript + '"';
      setTimeout(() => {
        performSearch(transcript);
      }, 400);
    }
  };

  recognition.onerror = (event) => {
    console.error('Speech recognition error:', event.error);
    isListening = false;
    micBtn.classList.remove('listening');
    voiceStatus.textContent = event.error === 'not-allowed' ? 'Microphone access denied' : 'Could not hear you. Try again.';
    setTimeout(() => {
      voiceStatus.classList.remove('active');
    }, 2500);
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    setTimeout(() => {
      voiceStatus.classList.remove('active');
    }, 2000);
  };

  micBtn.addEventListener('click', () => {
    if (isListening) {
      recognition.stop();
    } else {
      try {
        recognition.start();
      } catch (err) {
        console.error('Failed to start speech recognition:', err);
      }
    }
  });
} else {
  micBtn.title = 'Voice search not supported in this browser version';
  micBtn.addEventListener('click', () => {
    voiceStatus.textContent = 'Voice search is not available';
    voiceStatus.classList.add('active');
    setTimeout(() => voiceStatus.classList.remove('active'), 2500);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => searchInput.focus(), 150);
});
